# Kafka CLI client config (kafka-topics, kafka-acls, kafka-console-*, perf tests).
# Pass the bootstrap with --bootstrap-server (HA: cp-edge-ha.test:30000, slim: cp-edge-slim.test:31000).
# Run from the repo root (truststore path is relative); truststore is generated by scripts/certs.sh.
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="kafka-secret";
ssl.truststore.type=PKCS12
ssl.truststore.location=./certs/truststore.p12
ssl.truststore.password=changeit
