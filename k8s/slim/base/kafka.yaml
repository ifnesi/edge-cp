# Combined-mode node (process.roles=broker,controller).
# CFK has no first-class combined mode, so this is a KRaftController CR (named "kafka" so the
# in-cluster DNS name is kafka.cp-edge-slim.svc.cluster.local) whose generated controller config
# is extended via configOverrides with the broker role and the INTERNAL/EXTERNAL listeners.
# All listeners are SASL_SSL (PLAIN) using the CFK-managed keystore (secret tls-cp) and the
# user store from secret kafka-credential (plain-users.json, hot-reloaded every 3s).
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kafka
spec:
  replicas: 1
  dataVolumeCapacity: 20Gi
  image:
    application: confluentinc/cp-server:8.4.1
    init: confluentinc/confluent-init-container:3.4.1
  podTemplate:
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
  # If CFK was installed with --set licenseKey=<key>:
  # license:
  #   globalLicense: true
  tls:
    secretRef: tls-cp
  listeners:
    # advertised.listeners is set in configOverrides below (CFK would otherwise only advertise CONTROLLER)
    advertisedListenersEnabled: false
    # CONTROLLER (9074) is generated by CFK; REPLICATION/INTERNAL/EXTERNAL are added in configOverrides
    controller:
      tls:
        enabled: true
      authentication:
        type: plain
        jaasConfig:
          secretRef: kafka-credential
  authorization:
    type: simple
    superUsers:
      - User:kafka
  configOverrides:
    server:
      # --- Combined mode: broker + controller in one process
      - process.roles=broker,controller
      - listeners=CONTROLLER://:9074,REPLICATION://:9072,INTERNAL://:9071,EXTERNAL://:9092
      - advertised.listeners=CONTROLLER://kafka-0.kafka.cp-edge-slim.svc.cluster.local:9074,REPLICATION://kafka-0.kafka.cp-edge-slim.svc.cluster.local:9072,INTERNAL://kafka-0.kafka.cp-edge-slim.svc.cluster.local:9071,EXTERNAL://kafka.cp-edge-slim.test:31000
      - listener.security.protocol.map=CONTROLLER:SASL_SSL,REPLICATION:SASL_SSL,INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL
      - inter.broker.listener.name=REPLICATION
      # The user store CFK mounts for the controller listener (from secret kafka-credential) is reused by all listeners
      # --- REPLICATION listener (inter-broker; the node connects to itself as user "kafka")
      - listener.name.replication.sasl.enabled.mechanisms=PLAIN
      - listener.name.replication.plain.sasl.jaas.config=io.confluent.kafka.server.plugins.auth.FileBasedLoginModule required username="${file:/mnt/secrets/kafka-controller-listener-apikeys/plain.txt:username}" password="${file:/mnt/secrets/kafka-controller-listener-apikeys/plain.txt:password}" config_path="/mnt/secrets/kafka-controller-listener-apikeys/apikeys.json" refresh_ms="3000";
      - listener.name.replication.ssl.keystore.location=/mnt/sslcerts/keystore.p12
      - listener.name.replication.ssl.keystore.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      - listener.name.replication.ssl.key.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      - listener.name.replication.ssl.truststore.location=/mnt/sslcerts/truststore.p12
      - listener.name.replication.ssl.truststore.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      # --- INTERNAL listener (in-cluster clients: Schema Registry, Control Center)
      - listener.name.internal.sasl.enabled.mechanisms=PLAIN
      - listener.name.internal.plain.sasl.jaas.config=io.confluent.kafka.server.plugins.auth.FileBasedLoginModule required config_path="/mnt/secrets/kafka-controller-listener-apikeys/apikeys.json" refresh_ms="3000";
      - listener.name.internal.ssl.keystore.location=/mnt/sslcerts/keystore.p12
      - listener.name.internal.ssl.keystore.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      - listener.name.internal.ssl.key.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      - listener.name.internal.ssl.truststore.location=/mnt/sslcerts/truststore.p12
      - listener.name.internal.ssl.truststore.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      # --- EXTERNAL listener (clients outside the cluster, via Service kafka-external)
      - listener.name.external.sasl.enabled.mechanisms=PLAIN
      - listener.name.external.plain.sasl.jaas.config=io.confluent.kafka.server.plugins.auth.FileBasedLoginModule required config_path="/mnt/secrets/kafka-controller-listener-apikeys/apikeys.json" refresh_ms="3000";
      - listener.name.external.ssl.keystore.location=/mnt/sslcerts/keystore.p12
      - listener.name.external.ssl.keystore.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      - listener.name.external.ssl.key.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      - listener.name.external.ssl.truststore.location=/mnt/sslcerts/truststore.p12
      - listener.name.external.ssl.truststore.password=${file:/mnt/sslcerts/jksPassword.txt:jksPassword}
      # --- Single node: replication factor 1 for everything
      - default.replication.factor=1
      - min.insync.replicas=1
      - offsets.topic.replication.factor=1
      - transaction.state.log.replication.factor=1
      - transaction.state.log.min.isr=1
      - confluent.license.topic.replication.factor=1
      - confluent.metadata.topic.replication.factor=1
      - confluent.tier.metadata.replication.factor=1
      - confluent.cluster.link.metadata.topic.replication.factor=1
      - confluent.security.event.logger.exporter.kafka.topic.replicas=1
      - confluent.balancer.topic.replication.factor=1
      - confluent.balancer.enable=false
      # --- ACLs
      - allow.everyone.if.no.acl.found=false
  # Ship metrics (OTLP) to the Prometheus bundled with Control Center
  dependencies:
    metricsClient:
      url: http://controlcenter.cp-edge-slim.svc.cluster.local:9090
