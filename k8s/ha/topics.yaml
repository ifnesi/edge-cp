# Demo topics, managed by CFK through the embedded Kafka REST API (KafkaRestClass kafka-rest)
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: demo-topic      # Python / Avro clients (Schema Registry subject demo-topic-value)
spec:
  kafkaRestClassRef:
    name: kafka-rest
  replicas: 3
  partitionCount: 3
  configs:
    cleanup.policy: "delete"
    retention.ms: "604800000"   # 7 days
    min.insync.replicas: "2"
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: perf-topic      # kafka-producer-perf-test and plain (non-Avro) console tools
spec:
  kafkaRestClassRef:
    name: kafka-rest
  replicas: 3
  partitionCount: 3
  configs:
    cleanup.policy: "delete"
    retention.ms: "604800000"   # 7 days
    min.insync.replicas: "2"
